# Reference: https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners

# Conditions for pushing the image to GHCR:
#   - Triggered by push to default branch (`main`)
#   - Triggered by push to a version tag (`v*`)
#   - Triggered by a scheduled run
#   - Triggered manually via `workflow_dispatch` with `push: true`
#
# Conditional expression:
#   github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event.inputs.push

# This fork only builds and publishes the Docker image: the upstream release
# jobs (Render deploys, Helm chart, mobile and desktop apps, GitHub release)
# were removed.

name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag or commit SHA) to build'
        required: true
        type: string 
        default: 'main'
      push:
        description: 'Push the image to container registry'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - 'charts/**'
      - 'mobile/**'
  schedule:
    - cron: '30 1 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Select the release channel and legacy alias through December; no date pin.
  COMPATIBILITY_CHANNEL: 'alpha'
  COMPATIBILITY_VERSION: '0.7.7-alpha.5'

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Resolve canonical release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      publish: ${{ steps.release.outputs.publish }}
      release: ${{ steps.release.outputs.release }}
      stable: ${{ steps.release.outputs.stable }}
      alpha: ${{ steps.release.outputs.alpha }}
      compatibility_version: ${{ steps.release.outputs.compatibility_version }}
      release_name: ${{ steps.release.outputs.release_name }}
      alias_note: ${{ steps.release.outputs.alias_note }}
      image_tags: ${{ steps.release.outputs.image_tags }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.sha }}
      - name: Read original workflow date
        id: build_date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          echo "BUILD_DATE=$(date -u -d "$created" +%Y.%-m.%-d)" >> "$GITHUB_ENV"

      - name: Resolve release tags
        id: release
        env:
          SELECTED_REF: ${{ github.event.inputs.ref || github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          # Legacy tags are aliases only; they must never start another release.
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v0.* ]]; then
            printf '%s\n' 'publish=false' 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${BUILD_DATE}-alpha"
          # Scheduled image tags, OCI metadata and embedded identity must agree.
          [[ "$GITHUB_EVENT_NAME" != schedule ]] || version="${BUILD_DATE}-nightly"
          # Selected tags determine identity; only tag pushes publish releases.
          selected_tag=""
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            selected_tag="$GITHUB_REF"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$SELECTED_REF" == refs/tags/* ]]; then
              selected_tag="$SELECTED_REF"
            elif git show-ref --verify --quiet "refs/tags/$SELECTED_REF"; then
              selected_tag="refs/tags/$SELECTED_REF"
            fi
          fi
          if [[ -n "$selected_tag" ]]; then
            version="${selected_tag#refs/tags/v}"
            [[ "$version" =~ ^[2-9][0-9]{3}\.[1-9][0-9]?\.[1-9][0-9]?(-alpha)?$ ]] || exit 1
            base="${version%%-*}"
            [[ "$(date -u -d "${base//./-}" +%Y.%-m.%-d)" == "$base" ]] || exit 1
          fi
          stable=false; alpha=false; compatibility=""
          [[ "$version" == *-* ]] || stable=true
          [[ "$version" != *-alpha ]] || alpha=true
          channel=stable
          [[ "$alpha" != true ]] || channel=alpha
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* && "$version" == 2026.* && "$channel" == "$COMPATIBILITY_CHANNEL" ]]; then
            compatibility="$COMPATIBILITY_VERSION"
            [[ -z "$compatibility" || "$compatibility" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]] || exit 1
          fi
          publish=true; release=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            release=true
          fi
          {
            echo "version=$version"
            echo "commit=$(git rev-parse HEAD)"
            printf '%s\n' "publish=$publish" "release=$release" "stable=$stable" "alpha=$alpha"
            printf '%s\n' "compatibility_version=$compatibility"
            echo "release_name=v${version}${compatibility:+ — compatibility: v${compatibility}}"
            echo "alias_note=${compatibility:+Compatibility alias: v${compatibility} (same commit and image).}"
            echo 'image_tags<<RELEASE_TAGS'
            if [[ "$release" == true ]]; then
              echo "type=raw,value=$version"
              [[ -z "$compatibility" ]] || echo "type=raw,value=$compatibility"
              [[ "$stable" != true ]] || echo 'type=raw,value=stable'
              [[ "$alpha" != true ]] || echo 'type=raw,value=latest'
            else
              echo "type=raw,value=sha-$(git rev-parse HEAD)"
              if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
                echo 'type=schedule,pattern=nightly'
                echo "type=raw,value=$version"
              fi
            fi
            echo 'RELEASE_TAGS'
          } >> "$GITHUB_OUTPUT"

  ci:
    needs: [prepare]
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      require_js_dependency_audit: false

  build:
    name: Build Docker image
    needs: [prepare, ci]

    strategy:
      fail-fast: false
      matrix:
        # The image only runs on an amd64 Linux host (LXC), so arm64 is not built.
        platform: [amd64]
        include:
          - platform: amd64
            runs-on: ubuntu-24.04

    timeout-minutes: 60
    runs-on: ${{ matrix.runs-on }}

    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
          # Full history so docker/metadata-action can resolve the commit date.
          fetch-depth: 0

      - name: Generate embedded version
        id: version_file
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: printf '%s\n' "$VERSION" > .sure-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to the container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current date (RFC 3339 format)
        id: date
        run: echo "date=$(date -Iseconds)" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: ${{ needs.prepare.outputs.image_tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.vendor=we-promise
            org.opencontainers.image.title=Sure
            org.opencontainers.image.description=A multi-arch Docker image for the Sure Rails app

      - name: Publish 'linux/${{ matrix.platform }}' image by digest
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        id: build
        with:
          context: .
          build-args: BUILD_COMMIT_SHA=${{ needs.prepare.outputs.commit }}
          platforms: 'linux/${{ matrix.platform }}'
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-${{ matrix.platform }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-${{ matrix.platform }},mode=max
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          push: true
          # DO NOT REMOVE `oci-mediatypes=true`, fixes annotation not showing up on job.merge.steps[-1]
          # ref: https://github.com/docker/build-push-action/discussions/1022
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},name-canonical=true,push-by-digest=true,oci-mediatypes=true

      - name: Export the Docker image digest
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event.inputs.push }}
        run: |
          mkdir -p "${RUNNER_TEMP}"/digests
          echo "${DIGEST#sha256:}" > "${RUNNER_TEMP}/digests/digest-${PLATFORM}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}

      - name: Upload the Docker image digest
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event.inputs.push }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digest-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest & push multi-arch tag
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event.inputs.push }}
    needs: [prepare, build]

    timeout-minutes: 60
    runs-on: 'ubuntu-24.04'

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.compatibility_version != ''
      - name: Create or verify compatibility tag
        id: compatibility
        if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.compatibility_version != ''
        env:
          COMPATIBILITY_VERSION: ${{ needs.prepare.outputs.compatibility_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMPATIBILITY_VERSION" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]] || exit 1
          # A non-force push either creates the alias or leaves the existing tag intact.
          if ! git push origin "HEAD:refs/tags/v${COMPATIBILITY_VERSION}"; then
            git fetch --no-tags origin "refs/tags/v${COMPATIBILITY_VERSION}"
            if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$(git rev-parse HEAD)" ]]; then
              echo "Compatibility tag points to another commit; refusing to move it." >&2
              exit 1
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Download Docker image digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to the container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and push Docker image
        env:
          TAGS: ${{ needs.build.outputs.tags }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash -xeuo pipefail {0}
        run: |
          tag_args=()
          while IFS=$'\n' read -r tag; do
            [[ -n "${tag}" ]] || continue
            tag_args+=("--tag=${tag}")
          done <<< "${TAGS}"

          image_args=()
          for PLATFORM in amd64; do
            image_args+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:$(<"${DIGESTS_DIR}/digest-${PLATFORM}")")
          done

          annotations=(
            "index:org.opencontainers.image.created=$(date -Iseconds)"
            'index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}'
            "index:org.opencontainers.image.revision=${COMMIT}"
            "index:org.opencontainers.image.ref.name=${REF_NAME}"
            'index:org.opencontainers.image.vendor=we-promise'
            'index:org.opencontainers.image.licenses=AGPL-3.0'
            'index:org.opencontainers.image.title=Sure'
            'index:org.opencontainers.image.description=A multi-arch Docker image for the Sure Rails app'
          )
          annotation_args=()
          for annotation in "${annotations[@]}"; do
            annotation_args+=("--annotation=${annotation}")
          done
          annotation_args+=("--annotation=index:org.opencontainers.image.version=$VERSION")

          attempts=0
          until docker buildx imagetools create \
            "${annotation_args[@]}" \
            "${tag_args[@]}" \
            "${image_args[@]}" \
          ; do
            attempts=$((attempts + 1))
            if [[ $attempts -ge 3 ]]; then
              echo "[$(date -u)] ERROR: Failed after 3 attempts." >&2
              exit 1
            fi
            delay=$((2 ** attempts))
            if [[ $delay -gt 15 ]]; then delay=15; fi
            echo "Push failed (attempt $attempts). Retrying in ${delay} seconds..."
            sleep ${delay}
          done
